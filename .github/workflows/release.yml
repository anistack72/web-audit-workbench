name: Release tested version
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verified-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository_owner == 'anistack72' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify release controller
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify packaged onboarding and runtime
        run: |
          set -euo pipefail
          npm run check
          npm test
          mkdir -p release-output
          npm pack --ignore-scripts --pack-destination release-output --json > release-output/pack.json
      - name: Publish only the fully tested version
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/publish_release.py
